<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mera Radio TV Overlay</title>
    <style>
        body {
            background-color: transparent;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            color: #ffffff;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Scaled up container to prevent clipping at crisp resolutions */
        #music-overlay {
            position: absolute;
            bottom: 50px;
            left: 50px;
            display: flex;
            align-items: center;
            background: transparent; 
            padding: 24px 36px;
            width: 950px; /* Wider bounding box to prevent large text from cutting off */
        }

        /* Mathematically doubled artwork size from 85px to 170px */
        #artwork {
            width: 170px;
            height: 170px;
            border-radius: 12px;
            object-fit: cover;
            margin-right: 40px; /* Proportionately wider gap between artwork and text */
            background-color: transparent;
        }

        #track-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
            width: 100%;
        }

        /* Crisp vector text at double the original size (22px -> 44px) */
        #title {
            font-size: 44px; 
            font-weight: 700;
            margin-bottom: 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #ffffff;
        }

        /* Crisp vector text at double the original size (16px -> 32px) */
        #artist {
            font-size: 32px;
            color: #e0e0e0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>

    <div id="music-overlay">
        <img id="artwork" src="https://radio.co" alt="Art">
        <div id="track-info">
            <div id="title">Mera Radio</div>
            <div id="artist">Live Stream</div>
        </div>
    </div>

    <script>
        // Directly maps the elements out without breaking text layout grids
        function parseTrackInfo(titleString) {
            var rawText = String(titleString);
            var separated = { artist: "Mera Radio", title: rawText };
            
            if (rawText.indexOf(" - ") !== -1) {
                var pieces = rawText.split(" - ");
                if (pieces.length >= 2) {
                    // Restored your exact direct array mappings safely
                    separated.artist = pieces[0].trim();
                    separated.title = pieces.slice(1).join(" - ").trim();
                }
            }
            return separated;
        }

        async function fetchLiveStreamData() {
            var STATION_ID = "s8c6000217";
            var PRIMARY_API = "https://public.radio.co/stations/" + STATION_ID + "/status";
            
            try {
                var response = await fetch(PRIMARY_API);
                if (!response.ok) return;
                
                var data = await response.json();
                if (data && data.current_track && data.current_track.title) {
                    var parsed = parseTrackInfo(data.current_track.title);
                    
                    document.getElementById('title').innerText = parsed.title;
                    document.getElementById('artist').innerText = parsed.artist;

                    var imgUrl = "https://radio.co";
                    if (data.current_track.artwork_url_large) {
                        imgUrl = data.current_track.artwork_url_large;
                    } else if (data.current_track.artwork_url) {
                        imgUrl = data.current_track.artwork_url;
                    }
                    document.getElementById('artwork').src = imgUrl;
                }
            } catch (error) {
                console.log("Direct API check encountered field sync variances:", error);
            }
        }

        // Trigger updates seamlessly every 6 seconds
        fetchLiveStreamData();
        setInterval(fetchLiveStreamData, 6000);
    </script>
</body>
</html>
